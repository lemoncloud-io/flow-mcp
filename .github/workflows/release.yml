name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:type
      - run: npm test
      - run: npm run build

      - name: Get version before release
        id: pre-version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        id: release
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get version after release
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${{ steps.pre-version.outputs.version }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & attach Desktop Extension (.mcpb)
        if: success() && steps.version.outputs.released == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm prune --omit=dev
          node scripts/sync-manifest.mjs "$VERSION"
          npx -y @anthropic-ai/mcpb@latest pack . flow-mcp.mcpb
          gh release upload "v$VERSION" flow-mcp.mcpb --clobber

      - name: Notify DoU
        if: success() && steps.version.outputs.released == 'true'
        uses: lemoncloud-io/actions/notify-dou@v1
        with:
          url: ${{ secrets.DOU_WEBHOOK_URL }}
          token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
          channel-id: ${{ secrets.DOU_CHANNEL_ID }}
          status: success
          stage: release
          title: '@lemoncloud/flow-mcp v${{ steps.version.outputs.version }} npm 배포 완료'
          text: |
            • npm: https://www.npmjs.com/package/@lemoncloud/flow-mcp
            • Release Notes: https://github.com/${{ github.repository }}/releases

      - name: Notify DoU - failure
        if: failure() && steps.release.outcome == 'failure'
        uses: lemoncloud-io/actions/notify-dou@v1
        with:
          url: ${{ secrets.DOU_WEBHOOK_URL }}
          token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
          channel-id: ${{ secrets.DOU_CHANNEL_ID }}
          status: failure
          stage: release
          text: |
            *@lemoncloud/flow-mcp* 릴리스 파이프라인 실패
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Actions Run 확인>
